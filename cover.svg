<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7f7"/>
      <stop offset="100%" stop-color="#e8f4f0"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5BA4CF"/>
      <stop offset="100%" stop-color="#4A90B8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ABF8B"/>
      <stop offset="100%" stop-color="#58A87A"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CB8B8"/>
      <stop offset="100%" stop-color="#4AA3A3"/>
    </linearGradient>
    <linearGradient id="lightBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4eaf0"/>
      <stop offset="100%" stop-color="#c0dfe8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#4A90B8" flood-opacity="0.08"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1100" height="440" rx="16" fill="url(#bg)"/>
  <circle cx="980" cy="80" r="90" fill="#d4eaf0" opacity="0.3"/>
  <circle cx="120" cy="380" r="60" fill="#d4ecd8" opacity="0.25"/>

  <!-- Monitor -->
  <rect x="60" y="55" width="380" height="260" rx="14" fill="white" filter="url(#shadow)" stroke="#d0e2e8" stroke-width="1.5"/>
  <rect x="78" y="72" width="344" height="224" rx="6" fill="#f5fafc"/>
  <!-- Code lines inside monitor -->
  <rect x="95" y="88" width="90" height="5" rx="2.5" fill="#5BA4CF" opacity="0.5"/>
  <rect x="95" y="105" width="140" height="5" rx="2.5" fill="#6ABF8B" opacity="0.5"/>
  <rect x="95" y="122" width="60" height="5" rx="2.5" fill="#5CB8B8" opacity="0.45"/>
  <rect x="108" y="139" width="200" height="5" rx="2.5" fill="#5BA4CF" opacity="0.45"/>
  <rect x="108" y="156" width="160" height="5" rx="2.5" fill="#6ABF8B" opacity="0.45"/>
  <rect x="95" y="180" width="80" height="5" rx="2.5" fill="#5CB8B8" opacity="0.5"/>
  <rect x="108" y="197" width="180" height="5" rx="2.5" fill="#5BA4CF" opacity="0.4"/>
  <rect x="108" y="214" width="120" height="5" rx="2.5" fill="#6ABF8B" opacity="0.35"/>
  <rect x="95" y="238" width="170" height="5" rx="2.5" fill="#5CB8B8" opacity="0.45"/>
  <rect x="95" y="255" width="100" height="5" rx="2.5" fill="#5BA4CF" opacity="0.35"/>
  <!-- Monitor stand -->
  <rect x="220" y="315" width="60" height="16" rx="4" fill="#c0d9e0"/>
  <rect x="200" y="331" width="100" height="8" rx="4" fill="#c0d9e0"/>

  <!-- Component tree -->
  <!-- App -->
  <rect x="520" y="60" width="180" height="40" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="610" y="86" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">App</text>
  <line x1="610" y1="100" x2="610" y2="120" stroke="#5BA4CF" stroke-width="2" opacity="0.4"/>

  <!-- SearchPage -->
  <rect x="520" y="120" width="180" height="40" rx="10" fill="url(#tealGrad)" filter="url(#shadow)"/>
  <text x="610" y="146" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">SearchPage</text>
  <line x1="570" y1="160" x2="570" y2="180" stroke="#5CB8B8" stroke-width="1.5" opacity="0.4"/>
  <line x1="610" y1="160" x2="610" y2="180" stroke="#5CB8B8" stroke-width="1.5" opacity="0.4"/>
  <line x1="650" y1="160" x2="650" y2="180" stroke="#5CB8B8" stroke-width="1.5" opacity="0.4"/>

  <!-- Child components -->
  <rect x="490" y="180" width="160" height="38" rx="8" fill="white" stroke="#6ABF8B" stroke-width="1.5" filter="url(#badgeShadow)"/>
  <text x="570" y="203" text-anchor="middle" fill="#4a7a5e" font-family="system-ui, sans-serif" font-size="11" font-weight="500">SearchInput</text>

  <rect x="530" y="235" width="160" height="38" rx="8" fill="white" stroke="#6ABF8B" stroke-width="1.5" filter="url(#badgeShadow)"/>
  <text x="610" y="258" text-anchor="middle" fill="#4a7a5e" font-family="system-ui, sans-serif" font-size="11" font-weight="500">UserList</text>

  <rect x="490" y="290" width="160" height="38" rx="8" fill="white" stroke="#6ABF8B" stroke-width="1.5" filter="url(#badgeShadow)"/>
  <text x="570" y="313" text-anchor="middle" fill="#4a7a5e" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Pagination</text>

  <!-- Optimization labels -->
  <rect x="655" y="190" width="90" height="22" rx="11" fill="url(#lightBlue)"/>
  <text x="700" y="205" text-anchor="middle" fill="#3d7a8a" font-family="system-ui, sans-serif" font-size="9" font-weight="600">React.memo</text>

  <rect x="695" y="245" width="90" height="22" rx="11" fill="url(#lightBlue)"/>
  <text x="740" y="260" text-anchor="middle" fill="#3d7a8a" font-family="system-ui, sans-serif" font-size="9" font-weight="600">React.memo</text>

  <!-- useMemo badge -->
  <rect x="530" y="340" width="160" height="24" rx="12" fill="url(#lightBlue)"/>
  <text x="610" y="356" text-anchor="middle" fill="#3d7a8a" font-family="system-ui, sans-serif" font-size="10" font-weight="600">useMemo + useCallback</text>
  <line x1="610" y1="273" x2="610" y2="340" stroke="#5BA4CF" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- Performance badge -->
  <rect x="490" y="378" width="220" height="32" rx="16" fill="white" stroke="#6ABF8B" stroke-width="1" filter="url(#badgeShadow)"/>
  <text x="600" y="398" text-anchor="middle" fill="#58A87A" font-family="system-ui, sans-serif" font-size="12" font-weight="600">⚡ 渲染 37 次/次 → 4 次/次</text>

  <!-- Right decorative elements -->
  <text x="850" y="280" fill="#5BA4CF" opacity="0.08" font-family="monospace" font-size="50" font-weight="700">&lt;/&gt;</text>

  <circle cx="880" cy="120" r="5" fill="#6ABF8B" opacity="0.3"/>
  <circle cx="900" cy="140" r="3.5" fill="#5BA4CF" opacity="0.25"/>
  <circle cx="860" cy="150" r="4" fill="#5CB8B8" opacity="0.3"/>
  <circle cx="890" cy="175" r="3" fill="#6ABF8B" opacity="0.25"/>

  <!-- Bottom bar -->
  <rect x="390" y="425" width="320" height="4" rx="2" fill="#5BA4CF" opacity="0.12"/>
</svg>
