<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7f7"/>
      <stop offset="100%" stop-color="#e8f4f0"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E88070"/>
      <stop offset="100%" stop-color="#D46858"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ABF8B"/>
      <stop offset="100%" stop-color="#58A87A"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#4A90B8" flood-opacity="0.08"/>
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="900" height="360" rx="14" fill="url(#bg)"/>
  <!-- Before -->
  <rect x="30" y="50" width="400" height="280" rx="12" fill="white" filter="url(#shadow)" stroke="#e8d0c8" stroke-width="1.5"/>
  <rect x="30" y="50" width="400" height="38" rx="12" fill="url(#redGrad)"/><rect x="30" y="76" width="400" height="12" fill="url(#redGrad)"/>
  <text x="230" y="75" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="14" font-weight="700">❌ 优化前</text>
  <rect x="65" y="102" width="330" height="36" rx="8" fill="#fce8e4" stroke="#E88070" stroke-width="1.5"/>
  <text x="230" y="125" text-anchor="middle" fill="#b85a4a" font-family="system-ui,sans-serif" font-size="12" font-weight="600">SearchPage（状态更新）</text>
  <line x1="230" y1="138" x2="230" y2="155" stroke="#E88070" stroke-width="2" opacity="0.5"/>
  <line x1="155" y1="155" x2="155" y2="170" stroke="#E88070" stroke-width="1.5" opacity="0.45"/>
  <line x1="230" y1="155" x2="230" y2="170" stroke="#E88070" stroke-width="1.5" opacity="0.45"/>
  <line x1="305" y1="155" x2="305" y2="170" stroke="#E88070" stroke-width="1.5" opacity="0.45"/>
  <rect x="80" y="170" width="150" height="34" rx="7" fill="#fce8e4" stroke="#E88070" stroke-width="1"/>
  <text x="155" y="191" text-anchor="middle" fill="#b85a4a" font-family="system-ui,sans-serif" font-size="10" font-weight="500">SearchInput 🔄</text>
  <rect x="240" y="170" width="150" height="34" rx="7" fill="#fce8e4" stroke="#E88070" stroke-width="1"/>
  <text x="315" y="191" text-anchor="middle" fill="#b85a4a" font-family="system-ui,sans-serif" font-size="10" font-weight="500">UserList 🔄</text>
  <rect x="155" y="215" width="150" height="34" rx="7" fill="#fce8e4" stroke="#E88070" stroke-width="1"/>
  <text x="230" y="236" text-anchor="middle" fill="#b85a4a" font-family="system-ui,sans-serif" font-size="10" font-weight="500">Pagination 🔄</text>
  <rect x="65" y="268" width="330" height="30" rx="8" fill="#fff0ec"/>
  <text x="230" y="288" text-anchor="middle" fill="#c86a58" font-family="system-ui,sans-serif" font-size="11" font-weight="600">渲染 20+ 组件/次 · 页面卡顿</text>
  <!-- After -->
  <rect x="470" y="50" width="400" height="280" rx="12" fill="white" filter="url(#shadow)" stroke="#b8d8c8" stroke-width="1.5"/>
  <rect x="470" y="50" width="400" height="38" rx="12" fill="url(#greenGrad)"/><rect x="470" y="76" width="400" height="12" fill="url(#greenGrad)"/>
  <text x="670" y="75" text-anchor="middle" fill="white" font-family="system-ui,sans-serif" font-size="14" font-weight="700">✅ 优化后</text>
  <rect x="505" y="102" width="330" height="36" rx="8" fill="#e8f4ec" stroke="#6ABF8B" stroke-width="1.5"/>
  <text x="670" y="125" text-anchor="middle" fill="#3d7a5a" font-family="system-ui,sans-serif" font-size="12" font-weight="600">SearchPage（状态更新）</text>
  <line x1="600" y1="138" x2="600" y2="170" stroke="#6ABF8B" stroke-width="2" opacity="0.5"/>
  <rect x="525" y="170" width="150" height="34" rx="7" fill="#e8f4ec" stroke="#6ABF8B" stroke-width="1"/>
  <text x="600" y="191" text-anchor="middle" fill="#3d7a5a" font-family="system-ui,sans-serif" font-size="10" font-weight="500">SearchInput 🔄</text>
  <rect x="690" y="170" width="150" height="34" rx="7" fill="#f0faf0" stroke="#6ABF8B" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="765" y="185" text-anchor="middle" fill="#58A87A" font-family="system-ui,sans-serif" font-size="9">UserList</text>
  <text x="765" y="197" text-anchor="middle" fill="#6ABF8B" font-family="system-ui,sans-serif" font-size="9">(缓存 ⏸️)</text>
  <rect x="605" y="215" width="150" height="34" rx="7" fill="#f0faf0" stroke="#6ABF8B" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="680" y="230" text-anchor="middle" fill="#58A87A" font-family="system-ui,sans-serif" font-size="9">Pagination</text>
  <text x="680" y="242" text-anchor="middle" fill="#6ABF8B" font-family="system-ui,sans-serif" font-size="9">(缓存 ⏸️)</text>
  <rect x="505" y="268" width="330" height="30" rx="8" fill="#d4ecd8"/>
  <text x="670" y="288" text-anchor="middle" fill="#3d7a5a" font-family="system-ui,sans-serif" font-size="11" font-weight="600">只渲染 1 个组件/次 · 丝滑流畅</text>
  <circle cx="450" cy="190" r="24" fill="white" filter="url(#badgeShadow)" stroke="#d0e2e8" stroke-width="1.5"/>
  <text x="450" y="195" text-anchor="middle" fill="#5BA4CF" font-family="system-ui,sans-serif" font-size="13" font-weight="800">VS</text>
</svg>
